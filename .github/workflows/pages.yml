name: GitHub Pages

on:
  push:
    branches:
      - main  # Deploy from main branch
      - doc   # Also deploy from doc branch for testing
    paths:
      - 'book/**'  # Only trigger on book changes
      - '.github/workflows/pages.yml'  # Trigger on workflow changes

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  # Use Node 24 (current default) - Node 20 is deprecated
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the start and end of another run
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for git info

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdbook
        run: cargo install mdbook

      - name: Build the book
        run: |
          cd book
          mdbook build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/book
          keep_files: false
